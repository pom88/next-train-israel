name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *' # daily: the GTFS feed only covers ~30 days
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh timetable from the Ministry of Transport feed
        run: |
          if node scripts/build-data.mjs; then
            echo "Timetable refreshed."
          else
            echo "::warning::Could not refresh the timetable (feed unreachable from CI?). Deploying the committed copy."
          fi
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
